services:
  - type: web
    name: vmpos-license-dashboard
    env: python
    rootDir: license_server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:APP --bind 0.0.0.0:$PORT
    envVars:
      - key: VMPOS_LICENSE_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vmpos-license-db
          property: connectionString

databases:
  - name: vmpos-license-db
    plan: free
